name: Deploy to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      APP_DIR: FastAPIDockerCICITesting
      BRANCH: develop

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Missing repository secret EC2_HOST (example: 16.4.95.215)"
            missing=1
          else
            echo "EC2_HOST is set (${#EC2_HOST} chars)"
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Missing repository secret EC2_SSH_KEY (private key from ~/.ssh/fastapi_ec2_deploy)"
            missing=1
          else
            echo "EC2_SSH_KEY is set (${#EC2_SSH_KEY} chars)"
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/$APP_DIR"

          echo "==> Updating code to origin/$BRANCH"
          git fetch --prune origin
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git log --oneline -1

          echo "==> Ensuring Docker secrets exist"
          ./scripts/init-secrets.sh

          echo "==> Rebuilding and restarting containers"
          docker compose up -d --build --remove-orphans
          docker image prune -f >/dev/null

          echo "==> Waiting for /health"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          docker compose ps
          docker compose logs --tail 80 migrate app
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
