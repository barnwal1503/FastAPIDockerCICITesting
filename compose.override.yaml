# Local development only. Docker Compose merges this file automatically on
# `docker compose up`. On servers, skip it with `docker compose -f compose.yaml up -d`.
services:
  migrate:
    environment:
      ENVIRONMENT: development
    volumes:
      - .:/app

  app:
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    environment:
      ENVIRONMENT: development
    volumes:
      - .:/app

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
